name: Publish NuGet Package

on: workflow_dispatch
    
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    
    permissions:
      id-token: write   # enable GitHub OIDC token issuance for this job

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'   # not necessarily matching the library .net version 

      - name: Restore dependencies
        run: dotnet restore

      - name: Build project
        run: dotnet build ./Bodde.Query.OData/Bodde.Query.OData.csproj --configuration Release

      - name: Pack NuGet package
        run: dotnet pack ./Bodde.Query.OData/Bodde.Query.OData.csproj --configuration Release --output ./nupkg
    
      # Get a short-lived NuGet API key
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{secrets.NUGET_USER}}

      - name: NuGet push
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source "https://api.nuget.org/v3/index.json"

